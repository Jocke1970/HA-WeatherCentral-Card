name: CI

on:
  push:
    branches:
      - dev
      - beta
      - main
  pull_request:
    branches:
      - dev
      - beta
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build dependency
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Bundle card
        run: npm run build
