name: Publish bundle

on:
  push:
    branches:
      - beta
      - main
    paths-ignore:
      - weather-central-card.js

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install build dependency
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build release bundle
        run: npm run build:release
      - name: Commit generated bundle
        shell: bash
        run: |
          if git diff --quiet -- weather-central-card.js && git ls-files --error-unmatch weather-central-card.js >/dev/null 2>&1; then
            echo "Bundle already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-central-card.js
          git commit -m "Build weather-central-card.js [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
